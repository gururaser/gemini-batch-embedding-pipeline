[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gme"
version = "0.1.0"
description = "ETL pipeline: Gemini multimodal embeddings → Qdrant"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "qdrant-client>=1.17.0",
    "datasets>=3.0.0",
    "pyarrow>=17.0.0",
    "httpx[http2]>=0.27.0",
    "pillow>=10.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.0.0",
]

[project.scripts]
gme = "gme.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gme"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
